[workspace]
members = ["."]
resolver = "3"

[features]
fuzzing = []
# Off by default: the default build has no native dependency and no ort in its
# dependency graph. Enabling this compiles the adapter implementation only; the
# ONNX Runtime library is still loaded at run time from an explicit path, never
# downloaded or bundled, and no test requires it.
onnxruntime = ["dep:ort"]

[package]
name = "paddleocr-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "An independent native-Rust PaddleOCR port"
license = "Apache-2.0"
readme = "README.md"
publish = false

[[bin]]
name = "fuzz-primitives"
path = "src/bin/fuzz_primitives.rs"
required-features = ["fuzzing"]
test = false
bench = false

[dependencies]
# Selected by the recorded D-008 decision in docs/IMAGE_DECODER_DECISION.md.
# Default features only: no nightly, no benchmark, and no alternative zlib
# backend, so the dependency stays pure Rust and needs no C toolchain.
png = "=0.18.1"
# Selected by docs/ADR_RT004_RUNTIME_SELECTION.md. `load-dynamic` keeps the
# native library out of the build: nothing is downloaded or linked at build
# time.
ort = { version = "=2.0.0-rc.13", default-features = false, features = [
    "std",
    "load-dynamic",
    "api-28",
], optional = true }

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
missing_docs = "warn"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
strip = "symbols"

[dev-dependencies]
base64 = "=0.22.1"
serde_json = "=1.0.151"
sha2 = { version = "=0.10.9", default-features = false, features = ["force-soft"] }
